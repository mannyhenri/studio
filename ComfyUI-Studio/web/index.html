<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Film Engine Studio">
<title>Film Engine Studio</title>
<link rel="preload" href="/studio/static/branding/open-sans-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/studio/static/style.css?v=245">
<link rel="icon" href="/studio/static/branding/filmengine-app-icon.svg" type="image/svg+xml">
<link rel="icon" href="/studio/static/branding/filmengine-app-icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/studio/static/branding/filmengine-app-icon-256.png">
</head>
<body>
<header id="mtop">
  <a class="brand" href="#/home" title="Film Engine Studio · Home">
    <img class="fe-logo" src="/studio/static/branding/filmengine-mark.svg" alt="" width="26" height="30">
    <span class="fe-name">Film Engine <span>Studio</span></span>
  </a>
  <button class="fe-proj" id="projbtn" data-menu="proj" aria-haspopup="menu" aria-expanded="false" title="Switch project">
    <span class="fe-proj-n" id="projname">No project open</span><span class="fe-proj-s" id="projsub">Open a project</span>
  </button>
  <nav class="fe-track" id="menus" aria-label="Film phases"></nav>
  <div class="fe-rail">
    <button id="mq" class="mq" title="Open the queue"><span class="dot" id="mq-dot"></span><span id="mq-t">Idle</span></button>
    <a href="#/gallery" data-page="gallery" class="fe-rail-btn" title="Everything you've made"><svg viewBox="0 0 18 18"><path d="M3 3h5v5H3V3Zm7 0h5v5h-5V3ZM3 10h5v5H3v-5Zm7 0h5v5h-5v-5Z"/></svg><span class="l">Gallery</span></a>
    <a href="#/loras" data-page="loras" class="fe-rail-btn" title="Models &amp; LoRAs"><svg viewBox="0 0 18 18"><path d="M9 2.5l6 3.3v6.4l-6 3.3-6-3.3V5.8l6-3.3Zm0 0v6.6m6-3.3L9 9.1 3 5.8"/></svg><span class="l">Models</span></a>
    <a href="/" target="_blank" class="fe-rail-btn ext" title="ComfyUI's node graph (new tab)"><svg viewBox="0 0 18 18"><path d="M4.5 3.2a1.8 1.8 0 100 3.6 1.8 1.8 0 000-3.6Zm9 8a1.8 1.8 0 100 3.6 1.8 1.8 0 000-3.6ZM6.3 5h3.2a2 2 0 012 2v4.2M4.5 6.8v4.4a2 2 0 002 2h5.2"/></svg><span class="l">Nodes ↗</span></a>
    <a href="#/settings" data-page="settings" class="fe-rail-btn" title="Settings"><svg viewBox="0 0 18 18"><path d="M9 6.6A2.4 2.4 0 109 11.4 2.4 2.4 0 009 6.6ZM9 1.8v2M9 14.2v2M1.8 9h2M14.2 9h2M4 4l1.4 1.4M12.6 12.6L14 14M14 4l-1.4 1.4M5.4 12.6L4 14"/></svg><span class="l">Settings</span></a>
    <button class="incog-btn" title=""><svg viewBox="0 0 32 20" width="22" height="14"><path d="M2 6h28M6.5 6c-1 0-1.6.7-1.5 1.7l.6 5.2C5.8 15 7.4 16.5 9.5 16.5h1.6c2 0 3.6-1.4 3.9-3.4l.5-3.5c.1-.9.8-1.6 1.5-1.6s1.4.7 1.5 1.6l.5 3.5c.3 2 1.9 3.4 3.9 3.4h1.6c2.1 0 3.7-1.5 3.9-3.6l.6-5.2c.1-1-.5-1.7-1.5-1.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</header>
<div id="menupop" class="menupop hidden" role="menu"></div>
<main id="main"></main>
<footer id="status">
  <div id="queue-card" title="Open the queue"><span class="dot" id="q-dot"></span><b id="q-title">Idle</b><span class="q-count" id="q-count"></span><span class="q-sub" id="q-sub">Nothing rendering</span><div class="bar"><div id="q-bar"></div></div></div>
  <div id="mon" class="mon" title="Updates every 3 seconds while Studio is open">
    <div class="mrow2"><span>CPU</span><div class="mbar"><i id="m-cpu"></i></div><b id="t-cpu">–</b></div>
    <div class="mrow2"><span>GPU</span><div class="mbar"><i id="m-gpu"></i></div><b id="t-gpu">–</b></div>
    <div class="mrow2"><span>VRAM</span><div class="mbar"><i id="m-vram"></i></div><b id="t-vram">–</b></div>
    <div class="mrow2"><span>RAM</span><div class="mbar"><i id="m-ram"></i></div><b id="t-ram">–</b></div>
  </div>
  <div id="sys" class="sys">ComfyUI · <span id="sys-mem">…</span></div>
</footer>

<nav id="bnav">
  <a href="javascript:void 0" data-phase="pre"><i>✎</i><span>Pre-prod</span></a>
  <a href="javascript:void 0" data-phase="prod"><i>▶</i><span>Production</span></a>
  <a href="javascript:void 0" data-phase="post"><i>✂</i><span>Post</span></a>
  <a href="#/gallery" data-page="gallery"><i>▦</i><span>Gallery</span></a>
  <a href="javascript:void 0" id="bmore"><i>⋯</i><span>More</span></a>
</nav>
<div id="drawer" class="drawer hidden">
  <div class="drawer-head"><h3>Queue</h3><button class="icon" data-close>✕</button></div>
  <div id="machines"></div>
  <div id="drawer-body"></div>
  <div class="drawer-foot">
    <button class="ghost" id="q-stop">Stop current</button>
    <button class="ghost danger" id="q-clear">Clear waiting</button>
  </div>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<script src="/studio/static/app.js?v=251"></script>
</body>
</html>
